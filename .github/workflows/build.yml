name: Verify project
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Test browser BLE protocol
        run: node --test tests/*.test.cjs
      - name: Static JavaScript syntax
        run: node --check web/app.js && node --check web/keyboard.js
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: admin-toolkit-v0.6.0-lilygo-tdongle-s3
          path: firmware/.pio/build/lilygo-tdongle-s3/*.bin
          if-no-files-found: error

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell 5.1 collector
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'collectors/windows/Collect-Inventory.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            exit 1
          }
      - name: Run Fast inventory without USB or report files
        shell: powershell
        run: |
          .\collectors\windows\Collect-Inventory.ps1 -Mode Fast -NoTransfer
      - name: Run Full diagnostics without USB or report files
        shell: powershell
        run: |
          .\collectors\windows\Collect-Inventory.ps1 -Mode Full -MaxPnpDevices 10 -NoTransfer
      - name: Verify temporary PowerShell execution policy is restored
        shell: powershell
        run: |
          .\tests\Validate-TemporaryPolicy.ps1
