name: Verify project
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Test browser BLE protocol
        run: node --test tests/*.test.cjs
      - name: Static JavaScript syntax
        run: node --check web/app.js && node --check web/keyboard.js
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: admin-toolkit-v0.3.8-lilygo-tdongle-s3
          path: firmware/.pio/build/lilygo-tdongle-s3/*.bin
          if-no-files-found: error
