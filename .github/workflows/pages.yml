name: Publish BLE control page and web firmware installer
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firmware/**'
      - 'collectors/**'
      - 'scripts/build_web_installer.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build toolchain
        run: python -m pip install platformio esptool==4.8.1
      - name: Build ESP32-S3 firmware
        run: pio run -d firmware
      - name: Stage web panel and merged firmware for ESP Web Tools
        run: python scripts/build_web_installer.py --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
